name: Temporary StarryBio v3.6 migration

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'update/starrybio-v3.5.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Bootstrap verified v3.6 updater
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch v3.6.0 --depth 1 https://github.com/nota9x/StarryBio.git /tmp/starrybio-v3.6
          pnpm --dir /tmp/starrybio-v3.6 install --frozen-lockfile
          /tmp/starrybio-v3.6/node_modules/.bin/tsx /tmp/starrybio-v3.6/scripts/update-repository.ts --yes

      - name: Preserve deployment-specific test adaptations
        shell: bash
        run: |
          set -euo pipefail
          # Keep the customized-deployment-safe versions already present on this PR
          # when upstream release-only assertions would otherwise overwrite them.
          git checkout HEAD -- tests/e2e/release.spec.ts tests/unit/status.test.ts || true

      - name: Verify migrated deployment
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run test:unit
          pnpm run build
          pnpm run test:e2e
          pnpm audit

      - name: Commit v3.6 migration
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Actions tokens cannot modify workflow files on this repository;
          # those are synced separately through the authenticated GitHub connection.
          git checkout HEAD -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'chore(update): migrate to StarryBio v3.6.0'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
