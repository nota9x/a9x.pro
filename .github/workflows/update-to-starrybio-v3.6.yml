name: Temporary StarryBio v3.6 migration

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'update/starrybio-v3.5.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Apply StarryBio v3.6 source delta
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch v3.6.0 --depth 1 https://github.com/nota9x/StarryBio.git /tmp/starrybio-v3.6

          # v3.5 predates the new signed update artifacts, so this one transition is
          # performed from the exact immutable v3.6 tag. Preserve deployment-owned
          # config and workflow files; custom PNG assets are not present upstream and
          # therefore remain untouched.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='config/starrybio.config.ts' \
            /tmp/starrybio-v3.6/ ./

          # Remove paths deleted/renamed by v3.6.
          rm -f tests/e2e/release.spec.ts
          rm -f \
            public/assets/images/dnd.svg \
            public/assets/images/favicon.svg \
            public/assets/images/idle.svg \
            public/assets/images/offline.svg \
            public/assets/images/online.svg \
            public/assets/images/profile.svg

          # Migrate references to StarryBio-managed default status artwork while
          # preserving the site's custom profile/favicon assets and all other config.
          python - <<'PY'
          from pathlib import Path

          path = Path('config/starrybio.config.ts')
          text = path.read_text()
          for name in ('offline', 'online', 'dnd', 'idle'):
              text = text.replace(
                  f'assets/images/{name}.svg',
                  f'assets/images/default/{name}.svg',
              )
          path.write_text(text)

          # Keep the accessibility fix already discovered on this customized site.
          profile = Path('src/components/ProfileCard.astro')
          text = profile.read_text()
          text = text.replace(
              '<div class="profile-actions" aria-label="Profile actions">',
              '<div class="profile-actions" role="group" aria-label="Profile actions">',
          )
          profile.write_text(text)
          PY

      - name: Verify customized deployment
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run test:integration
          pnpm run build
          pnpm run test:e2e
          pnpm run test:e2e:fixtures
          pnpm audit

      - name: Commit v3.6 migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'chore(update): migrate to StarryBio v3.6.0'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
